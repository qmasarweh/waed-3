    <script type="application/ld+json">

  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Phones / iPad / “Request Desktop Website” on iPhone:
        // mark skip BEFORE React mounts so navy splash never appears.
        var ua = navigator.userAgent || "";
        var phone =
          /iP(hone|ad|od)/i.test(ua) ||
          (/Mobile|Android/i.test(ua) && /Safari|Chrome|CriOS|FxiOS/i.test(ua)) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ||
          (typeof navigator.maxTouchPoints === "number" && navigator.maxTouchPoints > 1) ||
          (window.matchMedia &&
            (window.matchMedia("(max-width: 920px)").matches ||
              window.matchMedia("(hover: none)").matches ||
              window.matchMedia("(pointer: coarse)").matches));
        if (phone) {
          document.documentElement.classList.add("waed-skip-intro");
          try {
            sessionStorage.setItem("waed-intro-seen", "1");
          } catch (e) {}
        }
      })();
    </script>
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <!--
      Deploy cache-bust: fetch a tiny build-id with cache:no-store.
      If it changed since last visit, force one hard navigation so Safari
      drops the old cached JS (fixes “works on some iPhones, not others”).
      Placeholders __WAED_*__ are replaced at build time by vite.cacheBustPlugin.
    -->
    <script>
      (function () {
        var BUILD = "__WAED_BUILD_ID__";
        var BASE = "__WAED_BASE__";
        // Skip Vite dev injections and unreplaced placeholders.
        if (!BUILD || BUILD.indexOf("__WAED_") === 0 || BUILD.indexOf("dev-") === 0) return;
        var KEY = "waed-build-id:" + BASE;
        var bustKey = "waed-bust-" + BUILD;
        var url = BASE.replace(/\/?$/, "/") + "build-id.txt?t=" + Date.now();
        fetch(url, { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.text() : "";
          })
          .then(function (text) {
            var id = String(text || "").trim();
            // Reject HTML / junk so Safari never rewrites the URL into a broken query.
            if (!id || id.length > 80 || !/^[A-Za-z0-9._-]+$/.test(id)) return;
            var prev = null;
            try {
              prev = localStorage.getItem(KEY);
              localStorage.setItem(KEY, id);
            } catch (e) {}
            if (!prev || prev === id) return;
            try {
              if (sessionStorage.getItem(bustKey)) return;
              sessionStorage.setItem(bustKey, "1");
            } catch (e) {}
            var next = location.pathname + "?_b=" + encodeURIComponent(id);
            if (location.hash) next += location.hash;
            location.replace(next);
          })
          .catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
